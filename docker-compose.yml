services:
  postgres:
    image: postgres:16-alpine
    container_name: portfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: tradeorders
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d tradeorders"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: portfolio-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth:
    build:
      context: .
      dockerfile: src/Portfolio.TradeOrderService.Auth/Dockerfile
    container_name: portfolio-auth
    restart: unless-stopped
    ports:
      - "5001:5001"

  api:
    build:
      context: .
      dockerfile: src/Portfolio.TradeOrderService.Api/Dockerfile
    container_name: portfolio-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      Database__ConnectionString: "Host=postgres;Port=5432;Database=tradeorders;Username=admin;Password=admin123"
    depends_on:
      postgres:
        condition: service_healthy

  sync:
    build:
      context: .
      dockerfile: src/Portfolio.TradeOrderService.Sync/Dockerfile
    container_name: portfolio-sync
    restart: unless-stopped
    environment:
      Database__ConnectionString: "Host=postgres;Port=5432;Database=tradeorders;Username=admin;Password=admin123"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__Username: guest
      RabbitMq__Password: guest
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
