services:
  postgres:
    image: postgres:16-alpine
    container_name: portfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: tradeorders
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d tradeorders"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/Portfolio.TradeOrderService.Api/Dockerfile
    container_name: portfolio-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      Database__ConnectionString: "Host=postgres;Port=5432;Database=tradeorders;Username=admin;Password=admin123"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
