services:
  postgres:
   #Use the official Postgres 16 image. alpine is a lightweight Linux variant — smaller download, faster startup.
    image: postgres:16-alpine
    #Gives the container a fixed name so it can be referenced easily
    container_name: portfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: tradeorders
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d tradeorders"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
