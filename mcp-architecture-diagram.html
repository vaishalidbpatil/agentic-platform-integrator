<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MCP Server Architecture — VS Code + OS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px;
      min-height: 100vh;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 32px;
    }
    svg {
      width: 100%;
      max-width: 960px;
      height: auto;
    }

    /* ---- layer fills ---- */
    .layer-os       { fill: #1a1f2e; stroke: #334155; stroke-width: 1.5; rx: 12; }
    .layer-vscode   { fill: #0d2137; stroke: #2563eb; stroke-width: 1.5; }
    .layer-claudecli{ fill: #12213a; stroke: #7c3aed; stroke-width: 1.5; }
    .layer-mcp      { fill: #1a2a1a; stroke: #16a34a; stroke-width: 1.5; }
    .layer-external { fill: #2a1f10; stroke: #d97706; stroke-width: 1.5; }

    /* ---- box fills ---- */
    .box-os       { fill: #1e2d45; stroke: #475569; stroke-width: 1; }
    .box-vscode   { fill: #1e3a5f; stroke: #3b82f6; stroke-width: 1; }
    .box-ext      { fill: #1e3a5f; stroke: #60a5fa; stroke-width: 1; }
    .box-cli      { fill: #2d1b5e; stroke: #8b5cf6; stroke-width: 1; }
    .box-mcp      { fill: #14311a; stroke: #22c55e; stroke-width: 1; }
    .box-svc      { fill: #3d2008; stroke: #f59e0b; stroke-width: 1; }

    /* ---- text ---- */
    .label-layer  { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; fill: #64748b; }
    .label-box    { font-size: 12px; font-weight: 600; fill: #e2e8f0; }
    .label-sub    { font-size: 10px; fill: #94a3b8; }
    .label-badge  { font-size: 9px; fill: #64748b; }

    /* ---- arrows ---- */
    .arrow-os     { stroke: #475569; stroke-width: 1.5; fill: none; marker-end: url(#arrowOS); }
    .arrow-vscode { stroke: #3b82f6; stroke-width: 1.5; fill: none; marker-end: url(#arrowVS); stroke-dasharray: 5,3; }
    .arrow-mcp    { stroke: #22c55e; stroke-width: 1.5; fill: none; marker-end: url(#arrowMCP); }
    .arrow-ext    { stroke: #f59e0b; stroke-width: 1.5; fill: none; marker-end: url(#arrowEXT); stroke-dasharray: 4,3; }
    .arrow-bi     { stroke: #8b5cf6; stroke-width: 1.5; fill: none; marker-end: url(#arrowBI); marker-start: url(#arrowBI2); }

    .proto-tag {
      font-size: 9px;
      fill: #64748b;
    }
  </style>
</head>
<body>
<h1>MCP Server Application Architecture</h1>

<svg viewBox="0 0 960 820" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowOS"  markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="arrowVS"  markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/>

    <marker id="arrowMCP" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#22c55e"/>

    <marker id="arrowEXT" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">

    <marker id="arrowBI"  markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">

    <marker id="arrowBI2" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
